project:
  type: book

book:
  title: 'Una prueba transicional de la confluencia de la reducción $\eta$'
  author:
    - name: "Maximiliano Onofre Martínez"
  chapters:
    - index.qmd
    - Capitulo1.qmd
    - Capitulo2.qmd
    - Capitulo3.qmd
    - Capitulo4.qmd
    - Conclusion.qmd
    - references.qmd

bibliography: references.bib
lang: es
format:
  pdf:
    cite-method: biblatex
    biblio-style: alphabetic
    biblatexoptions:
      - giveninits=true
    pdf-engine: xelatex
    documentclass: scrreprt
    toc-depth: 2
    number-depth: 0
    linkcolor: black
    toccolor: blue
    syntax-definitions: [lean.xml, state.xml]
    include-in-header: inpreamble.tex
    monofont: JuliaMono
    keep-tex: false

filters:
  - latex-environment
environments: [inpt, outpt]
